name: Run Website URL Collector (Shared Queue)
run-name: Collector ${{ inputs.website_url != '' && 'manual' || inputs.seed_set }} (#${{ github.run_number }})

on:
  workflow_dispatch:
    inputs:
      seed_set:
        description: Which seed file to run (seeds/<name>.csv). Ignored if a URL is typed below.
        required: true
        default: seeds_1
        type: choice
        options:
          - seeds_1
          - seeds_2
          - seeds_3
          - seeds_4
          - seeds_5
      website_url:
        description: Optional - company URL(s), comma-separated. Overrides the seed set (reports go to reports/manual)
        required: false
        default: ""
        type: string
      max_pages:
        description: Crawl page budget per company
        required: true
        default: "3000"
        type: string
      max_depth:
        description: Maximum hierarchy depth
        required: true
        default: "12"
        type: string
      workers:
        description: Parallel workers picking companies from the shared queue (1-20)
        required: true
        default: "6"
        type: string

permissions:
  contents: read

# Different seed sets run side by side. The same seed set never runs twice at once.
concurrency:
  group: website-url-collector-${{ inputs.website_url != '' && 'manual' || inputs.seed_set }}
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    outputs:
      workers: ${{ steps.split.outputs.workers }}
      total: ${{ steps.split.outputs.total }}
      set_name: ${{ steps.split.outputs.set_name }}
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install dependencies for the seed reader
        run: python -m pip install -r requirements.txt
      - name: Deduplicate companies and build the queue
        id: split
        env:
          INPUT_WEBSITES: ${{ inputs.website_url }}
          INPUT_WORKERS: ${{ inputs.workers }}
          INPUT_SEED_SET: ${{ inputs.seed_set }}
        shell: bash
        run: |
          python - <<'PY'
          import csv
          import json
          import os
          from pathlib import Path
          from urllib.parse import urlsplit
          from url_collector import Collector, seed_values

          manual = os.environ.get('INPUT_WEBSITES', '').strip()
          set_name = 'manual' if manual else os.environ['INPUT_SEED_SET']
          seed_file = f'seeds/{set_name}.csv'
          if not manual and not Path(seed_file).exists():
              raise SystemExit(f'Seed file not found: {seed_file}')
          # Explicit input overrides the seed file rather than appending to it.
          raw = seed_values([manual] if manual else [], None if manual else seed_file)
          urls = []
          seen = set()
          for value in raw:
              url = Collector.norm_seed(None, value)
              parts = urlsplit(url)
              if not parts.hostname or parts.username or parts.password:
                  raise SystemExit(f'Invalid company URL: {value!r}')
              # Treat http/https, www, and a trailing slash as duplicates for the same page.
              key = (parts.hostname.removeprefix('www.'), parts.port,
                     parts.path.rstrip('/'), parts.query, parts.fragment)
              if key not in seen:
                  seen.add(key)
                  urls.append(url)
          if not urls:
              raise SystemExit('No company URLs found')

          try:
              requested = int(os.environ.get('INPUT_WORKERS', '6'))
          except ValueError:
              requested = 6
          workers = max(1, min(20, requested, len(urls)))

          # The queue: one tiny seed file per company, numbered 1..N.
          folder = Path('crawl-batches')
          folder.mkdir()
          for n, url in enumerate(urls, start=1):
              with (folder / f'company-{n}.csv').open('w', encoding='utf-8', newline='') as f:
                  writer = csv.writer(f)
                  writer.writerow(['website_url'])
                  writer.writerow([url])
          print(f'Seed set {set_name}: {len(urls)} companies, {workers} workers')
          with open(os.environ['GITHUB_OUTPUT'], 'a', encoding='utf-8') as f:
              print(f'workers={json.dumps(list(range(1, workers + 1)))}', file=f)
              print(f'total={len(urls)}', file=f)
              print(f'set_name={set_name}', file=f)
          PY
      - uses: actions/upload-artifact@v4
        with:
          name: crawl-seed-batches
          path: crawl-batches/
          if-no-files-found: error

  collect:
    name: Worker ${{ matrix.shard }}
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 350
    # contents: write is needed only to create the small "claim" refs that stop
    # two workers taking the same company. They are deleted by the cleanup job.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        shard: ${{ fromJSON(needs.prepare.outputs.workers) }}
    env:
      WEBSITE_URL: ""
      MAX_PAGES: ${{ inputs.max_pages }}
      MAX_DEPTH: ${{ inputs.max_depth }}
      MAX_PAGINATION_PAGES: "2"
      MAX_LOAD_MORE_CLICKS: "1"
      MAX_RUNTIME_MINUTES: "170"
      PARALLEL_WEBSITES: "2"
      CONCURRENCY: "2"
      PYTHONUNBUFFERED: "1"
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
          cache: pip
      - name: Install dependencies
        run: python -m pip install -r requirements.txt
      - name: Install Playwright Chromium and Linux dependencies
        run: python -m playwright install --with-deps chromium
      - uses: actions/download-artifact@v4
        with:
          name: crawl-seed-batches
          path: crawl-batches
      - name: Pick companies from the shared queue until it is empty
        env:
          GH_TOKEN: ${{ github.token }}
          WORKER: ${{ matrix.shard }}
          TOTAL: ${{ needs.prepare.outputs.total }}
          RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
          CLAIM_DEADLINE_MIN: "170"
        shell: bash
        run: |
          set -uo pipefail
          mkdir -p crawl-output
          START=$(date +%s)
          DONE=0
          for N in $(seq 1 "$TOTAL"); do
            if [ $(( $(date +%s) - START )) -ge $(( CLAIM_DEADLINE_MIN * 60 )) ]; then
              echo "::warning::Worker $WORKER stopped taking new companies after ${CLAIM_DEADLINE_MIN} min"
              break
            fi
            # Atomic claim: creating a ref that already exists fails, so only one
            # worker can ever win company N.
            if ! RESP=$(gh api -X POST "repos/$GITHUB_REPOSITORY/git/refs" \
                  -f "ref=refs/heads/claims/$RUN_KEY/$N" -f "sha=$GITHUB_SHA" 2>&1); then
              if echo "$RESP" | grep -qi "already exists"; then
                continue
              fi
              echo "::error::Worker $WORKER could not claim company $N: $RESP"
              exit 1
            fi
            echo "=== Worker $WORKER claimed company $N of $TOTAL ==="
            OUT="crawl-output/company-$N"
            mkdir -p "$OUT"
            python url_collector.py --seeds "crawl-batches/company-$N.csv" \
              --output-dir "$OUT" --log "$OUT/collector.log" \
              || echo "::warning::Company $N exited with an error; worker $WORKER continues"
            DONE=$((DONE + 1))
          done
          echo "Worker $WORKER finished $DONE companies in $(( $(date +%s) - START ))s"
      - name: Upload worker reports and per-company backups
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: collector-shard-${{ matrix.shard }}
          path: crawl-output/
          if-no-files-found: warn
          retention-days: 30

  cleanup:
    name: Delete queue claims
    needs: collect
    if: ${{ always() }}
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Delete claim refs for this run
        env:
          GH_TOKEN: ${{ github.token }}
          RUN_KEY: ${{ github.run_id }}-${{ github.run_attempt }}
        shell: bash
        run: |
          gh api --paginate "repos/$GITHUB_REPOSITORY/git/matching-refs/heads/claims/$RUN_KEY/" \
            --jq '.[].ref' | while read -r ref; do
              gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/${ref}" || true
            done

  publish:
    name: Merge and publish once
    needs: [prepare, collect]
    # Publish whatever finished, even if one worker failed; missing companies show as NO_OUTPUT.
    if: ${{ !cancelled() && needs.prepare.result == 'success' && github.ref_type == 'branch' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: write
      actions: read
    env:
      SET_NAME: ${{ needs.prepare.outputs.set_name }}
      TOTAL: ${{ needs.prepare.outputs.total }}
      BRANCH: ${{ github.ref_name }}
      MAX_PAGES: ${{ inputs.max_pages }}
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ github.ref_name }}
          fetch-depth: 0
      - uses: actions/setup-python@v6
        with:
          python-version: "3.13"
      - name: Install report dependencies
        run: python -m pip install -r requirements.txt
      - uses: actions/download-artifact@v4
        with:
          name: crawl-seed-batches
          path: crawl-batches
      - uses: actions/download-artifact@v4
        with:
          pattern: collector-shard-*
          path: shard-reports

      # Everything is built in ./work first, so nothing in the repo is touched
      # until this run owns the publish lock.
      - name: Build reports for this seed set in ./work
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p work
          tar --exclude=./.git --exclude=./work --exclude=./shard-reports \
              --exclude=./crawl-batches -cf - . | tar -xf - -C work
          # Start from this seed set's own earlier tables, never the shared root ones.
          # A table that was split into _partN files is joined back together first.
          for f in RUN_SUMMARY.csv PDF_PAGES.csv PERFORMANCE_REPORT.csv PRIORITY_REPORT.csv; do
            rm -f "work/$f"
            base="${f%.csv}"
            if [ -f "reports/$SET_NAME/$f" ]; then
              cp "reports/$SET_NAME/$f" "work/$f"
            elif ls "reports/$SET_NAME/${base}_part"*.csv >/dev/null 2>&1; then
              python - "$SET_NAME" "$base" "work/$f" <<'PY'
          import csv
          import glob
          import re
          import sys
          set_name, base, dest = sys.argv[1:4]
          parts = sorted(glob.glob(f'reports/{set_name}/{base}_part*.csv'),
                         key=lambda p: int(re.search(r'_part(\d+)\.csv$', p).group(1)))
          with open(dest, 'w', encoding='utf-8-sig', newline='') as out:
              writer = csv.writer(out)
              for i, p in enumerate(parts):
                  with open(p, encoding='utf-8-sig', newline='') as src:
                      reader = csv.reader(src)
                      header = next(reader, None)
                      if i == 0 and header:
                          writer.writerow(header)
                      writer.writerows(reader)
          print(f'Joined {len(parts)} parts into {dest}')
          PY
            fi
          done
          python - <<'PY'
          import csv
          import os
          import re
          from pathlib import Path

          names = ('classified_pages.csv', 'pdf_pages.csv', 'html_pages.csv',
                   'failed_pages.csv', 'document_evidence.csv', 'skipped_pages.csv',
                   'PERFORMANCE_REPORT.csv', 'PRIORITY_REPORT.csv')
          total = int(os.environ['TOTAL'])

          def num(p):
              return int(re.search(r'company-(\d+)$', p.name).group(1))

          # shard-reports/collector-shard-W/company-N/<files>
          company_dirs = sorted(
              (d for d in Path('shard-reports').glob('collector-shard-*/company-*') if d.is_dir()),
              key=num)
          found = {num(d) for d in company_dirs}
          missing = sorted(set(range(1, total + 1)) - found)
          if missing:
              print(f'::warning::{len(missing)} of {total} companies have no output: {missing}')
          print(f'Merging {len(company_dirs)} of {total} companies')

          for name in names:
              header = None
              with open(Path('work') / name, 'w', encoding='utf-8-sig', newline='') as dest:
                  writer = csv.writer(dest)
                  for d in company_dirs:
                      path = d / name
                      if not path.exists():
                          print(f'::warning::{path} is missing')
                          continue
                      with path.open(encoding='utf-8-sig', newline='') as f:
                          reader = csv.reader(f)
                          columns = next(reader, None)
                          if columns is None:
                              continue
                          if header is None:
                              header = columns
                              writer.writerow(header)
                          elif columns != header:
                              raise SystemExit(f'CSV header mismatch: {path}')
                          writer.writerows(row for row in reader if row and row[0] != 'TOTAL')
          with open('work/collector.log', 'w', encoding='utf-8') as dest:
              for d in company_dirs:
                  log = d / 'collector.log'
                  if log.exists():
                      dest.write(f'\n--- {d.parent.name} / {d.name} ---\n')
                      dest.write(log.read_text(encoding='utf-8', errors='replace'))
          PY
          (cd work && python repository_results.py)
          (cd work && python github_summary.py)
          python company_summary.py --reports shard-reports --seeds crawl-batches \
            --total "$TOTAL" --set-name "$SET_NAME" --max-pages "${MAX_PAGES:-0}" \
            --previous "reports/$SET_NAME/COMPANY_SUMMARY.csv" \
            --out work/COMPANY_SUMMARY.csv --this-run-out work/COMPANY_SUMMARY_THIS_RUN.csv

      # Ticket lock: runs publish one at a time, in the order they arrive.
      - name: Wait for the publish lock
        id: lock
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -uo pipefail
          R="$GITHUB_REPOSITORY"
          TICKET="locks/publish/$(date +%s%N)-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          gh api -X POST "repos/$R/git/refs" -f "ref=refs/heads/$TICKET" -f "sha=$GITHUB_SHA" > /dev/null
          echo "ticket=$TICKET" >> "$GITHUB_OUTPUT"
          for i in $(seq 1 240); do
            AHEAD_ACTIVE=0
            while read -r ref; do
              [ -z "$ref" ] && continue
              if [ "$ref" = "refs/heads/$TICKET" ]; then break; fi
              rid=$(basename "$ref" | cut -d- -f2)
              status=$(gh api "repos/$R/actions/runs/$rid" --jq .status 2>/dev/null || echo unknown)
              # Tickets left by finished runs, or by an earlier attempt of this run, are stale.
              if [ "$status" = "completed" ] || [ "$rid" = "$GITHUB_RUN_ID" ]; then
                gh api -X DELETE "repos/$R/git/$ref" > /dev/null 2>&1 || true
                continue
              fi
              AHEAD_ACTIVE=1
              echo "Waiting: run $rid is publishing first"
              break
            done < <(gh api --paginate "repos/$R/git/matching-refs/heads/locks/publish/" --jq '.[].ref' | sort)
            if [ "$AHEAD_ACTIVE" = "0" ]; then
              echo "Publish lock acquired"
              exit 0
            fi
            sleep 15
          done
          echo "::error::Timed out after 60 min waiting for the publish lock"
          exit 1

      - name: Commit this seed set's reports
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Get the newest branch state now that we hold the lock.
          git pull --ff-only origin "$BRANCH"
          mkdir -p "reports/$SET_NAME"
          # Clear this set's old tables (including old _partN files); they are rewritten below.
          rm -f "reports/$SET_NAME"/*.csv
          # GitHub rejects files over 100 MB, so any table over 40 MB is saved as
          # NAME_part1.csv, NAME_part2.csv ... Each part keeps the header row.
          python - "$SET_NAME" <<'PY'
          import csv
          import io
          import os
          import shutil
          import sys

          set_name = sys.argv[1]
          LIMIT = 40 * 1024 * 1024
          out_dir = f'reports/{set_name}'
          for f in ('RUN_SUMMARY.csv', 'PDF_PAGES.csv', 'PERFORMANCE_REPORT.csv',
                    'PRIORITY_REPORT.csv', 'COMPANY_SUMMARY.csv'):
              src = f'work/{f}'
              if not os.path.exists(src):
                  continue
              size = os.path.getsize(src)
              if size <= LIMIT:
                  shutil.copyfile(src, f'{out_dir}/{f}')
                  continue
              base = f[:-4]
              part, written, writer, out = 0, 0, None, None
              with open(src, encoding='utf-8-sig', newline='') as fin:
                  reader = csv.reader(fin)
                  header = next(reader)
                  for row in reader:
                      buf = io.StringIO()
                      csv.writer(buf).writerow(row)
                      line = buf.getvalue()
                      n = len(line.encode('utf-8'))
                      if out is None or written + n > LIMIT:
                          if out:
                              out.close()
                          part += 1
                          out = open(f'{out_dir}/{base}_part{part}.csv', 'w',
                                     encoding='utf-8-sig', newline='')
                          writer = csv.writer(out)
                          writer.writerow(header)
                          written = 0
                      out.write(line)
                      written += n
              if out:
                  out.close()
              print(f'{f}: {size / 1048576:.1f} MB split into {part} parts')
          PY
          git add -A -f "reports/$SET_NAME"
          # Safety: this run may only change its own seed set's folder.
          OUTSIDE=$(git diff --cached --name-only | grep -v "^reports/$SET_NAME/" || true)
          if [ -n "$OUTSIDE" ]; then
            echo "::error::Refusing to commit files outside reports/$SET_NAME/: $OUTSIDE"
            exit 1
          fi
          # Safety: never try to push a file GitHub will reject.
          BIG=$(find "reports/$SET_NAME" -type f -size +90M || true)
          if [ -n "$BIG" ]; then
            echo "::error::Files over 90 MB cannot be pushed: $BIG"
            exit 1
          fi
          if git diff --cached --quiet; then
            echo "Reports have no changes to commit."
            exit 0
          fi
          git commit -m "Update website collector reports ($SET_NAME)"
          for try in 1 2 3 4 5; do
            if OUT=$(git push origin "HEAD:$BRANCH" 2>&1); then
              echo "$OUT"
              exit 0
            fi
            echo "$OUT"
            # Retrying cannot fix a rejected file, so stop straight away.
            if echo "$OUT" | grep -q "pre-receive hook declined"; then
              echo "::error::GitHub rejected the push (see messages above)"
              exit 1
            fi
            git pull --rebase origin "$BRANCH" || true
            sleep $((try * 5))
          done
          echo "::error::Could not push after 5 attempts"
          exit 1

      - name: Release the publish lock
        if: ${{ always() && steps.lock.outputs.ticket != '' }}
        env:
          GH_TOKEN: ${{ github.token }}
          TICKET: ${{ steps.lock.outputs.ticket }}
        shell: bash
        run: gh api -X DELETE "repos/$GITHUB_REPOSITORY/git/refs/heads/$TICKET" || true

      - name: Upload merged reports
        if: ${{ always() }}
        uses: actions/upload-artifact@v4
        with:
          name: url-collector-results
          path: |
            work/classified_pages.csv
            work/pdf_pages.csv
            work/html_pages.csv
            work/failed_pages.csv
            work/skipped_pages.csv
            work/document_evidence.csv
            work/collector.log
            work/RUN_SUMMARY.csv
            work/PDF_PAGES.csv
            work/PERFORMANCE_REPORT.csv
            work/PRIORITY_REPORT.csv
            work/COMPANY_SUMMARY.csv
            work/COMPANY_SUMMARY_THIS_RUN.csv
          if-no-files-found: warn
          retention-days: 30
